{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('class_page', cid=m.class_id) }}#members">‹ Back</a>
<h1>Edit member</h1>
<div class="box">
  <form method="post">
    <label for="n">Name</label><input id="n" name="name" value="{{ m.name }}" maxlength="80" required>
    <label for="c">ID / registration number (optional)</label><input id="c" name="code" value="{{ m.code or '' }}" maxlength="30">
    <button class="btn or big">Save changes</button>
  </form>
</div>
<h2>Attendance history</h2>
<div class="list">
  {% for h in history %}<div class="item"><span>{{ h.day }}{% if h.title %} · {{ h.title }}{% endif %}</span><span class="tag t-{{ h.status[0] }}">{{ h.status }}</span></div>
  {% else %}<div class="item"><span class="muted">No attendance recorded yet.</span></div>{% endfor %}
</div>
{% endblock %}
