{% extends "base.html" %}
{% block content %}
<h2 style="margin-top:8px">New class or group</h2>
<div class="box">
  <form method="post" action="{{ url_for('add_class') }}">
    <label for="n">Name</label>
    <input id="n" name="name" placeholder="e.g. Form 3A, Choir, Staff" maxlength="60" required>
    <button class="btn or big">Create class</button>
  </form>
</div>
<h2>My classes</h2>
<div class="list">
  {% for c in classes %}<a class="item" href="{{ url_for('class_page', cid=c.id) }}">
    <div class="t"><b>{{ c.name }}</b><span class="s">{{ c.members }} member(s) · {{ c.sessions }} session(s)</span></div><span style="color:var(--orange);font-size:1.5rem;font-weight:800">›</span></a>
  {% else %}<div class="item"><span class="muted">No classes yet. Create your first one above.</span></div>{% endfor %}
</div>
{% endblock %}
