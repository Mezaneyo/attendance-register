<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f3a">
  <title>{% block title %}{{ name }} · {{ cfg.org }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
  <style>
    :root{--navy:#0b1f3a;--orange:#f97316;--orange-d:#ea580c;--line:#d5dbe6;--bg:#f2f4f8;--muted:#5b6b82}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    a{color:var(--orange-d);font-weight:600}
    .top{background:var(--navy);border-bottom:4px solid var(--orange)}
    .top .in{max-width:760px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:1.1rem;line-height:1.1}
    .brand img{width:38px;height:38px;border-radius:8px}.brand small{display:block;font-weight:400;opacity:.75;font-size:.72rem}
    .top nav{display:flex;gap:4px}.top nav a{color:#fff;text-decoration:none;font-weight:700;padding:8px 12px;border-radius:6px}.top nav a.on{background:var(--orange)}
    .wrap{max-width:760px;margin:auto;padding:16px 16px 40px}
    h1{font-size:1.6rem;margin:4px 0 12px}
    h2{font-size:1.1rem;margin:24px 0 10px;border-left:6px solid var(--orange);padding-left:10px;text-transform:uppercase;letter-spacing:.03em}
    .box,.list,.stat{background:#fff;border:1px solid var(--line);border-radius:8px}
    .box{padding:14px;margin-bottom:12px}.list{margin-bottom:12px}
    .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-weight:400}
    .item:last-child{border-bottom:0}.item .t{flex:1 1 140px;min-width:0}.item .t b{display:block;font-weight:700}
    .s{color:var(--muted);font-size:.85rem}.muted{color:var(--muted)}
    .acts{display:flex;gap:6px;flex:none}.acts form,form.inline{margin:0;display:inline}
    label{display:block;font-weight:700;margin:10px 0 4px}
    input,select,textarea{width:100%;padding:12px;border:2px solid #b8c2d3;border-radius:8px;font:inherit;color:var(--navy);background:#fff}
    input:focus,select:focus,textarea:focus{outline:0;border-color:var(--orange)}
    .btn{display:inline-block;border:2px solid var(--navy);border-radius:8px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;text-align:center;background:var(--navy);color:#fff}
    .btn.big{display:block;width:100%;padding:16px;font-size:1.05rem;margin-top:12px}
    .btn.or{background:var(--orange);border-color:var(--orange);color:#fff}.btn.or:active{background:var(--orange-d)}
    .btn.out{background:#fff;color:var(--navy)}
    .btn.red{background:#fff;color:#c81e1e;border-color:#c81e1e}.btn.red.armed{background:#c81e1e;color:#fff}
    .btn.sm{padding:7px 11px;font-size:.85rem}.btn:disabled{opacity:.45}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
    .stat{border-top:4px solid var(--orange);padding:8px 4px;text-align:center}.stat b{display:block;font-size:1.3rem}.stat small{color:var(--muted);font-size:.72rem}
    .flash{padding:12px 14px;border-radius:8px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
    .flash.success{background:#dcfce7;color:#14532d}.flash.danger{background:#fee2e2;color:#7f1d1d}.flash.warning{background:#fef3c7;color:#78350f}.flash b{cursor:pointer}
    .pct{font-weight:800;font-size:1.1rem;min-width:52px;text-align:right}.ok{color:#15803d}.low{color:#c81e1e}.na{color:#8a96a8}
    .tag{display:inline-block;border-radius:4px;padding:1px 8px;font-weight:800;font-size:.8rem}
    .t-P{background:#dcfce7;color:#14532d}.t-L{background:#fef3c7;color:#78350f}.t-A{background:#fee2e2;color:#7f1d1d}.t-E{background:#e5e7eb;color:#374151}
    .rd{position:absolute;opacity:0;pointer-events:none}
    .mk{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:2px solid var(--c);border-radius:8px;color:var(--ct,var(--c));font-weight:800;font-size:1.05rem;background:#fff;cursor:pointer;margin-left:5px;user-select:none}
    .rd:checked+.mk{background:var(--c);color:var(--t,#fff)}
    .mk.P{--c:#16a34a}.mk.L{--c:#eab308;--ct:#a16207;--t:#422006}.mk.A{--c:#dc2626}.mk.E{--c:#64748b}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .save{position:sticky;bottom:0;background:linear-gradient(rgba(242,244,248,0),var(--bg) 35%);padding:14px 0 10px}
    .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
  </style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='icon.png') }}" alt=""><span>{{ name }}<small>{{ cfg.org }}</small></span></a>
  <nav><a class="{{ 'on' if request.endpoint in ('index', 'class_page', 'take', 'edit_member') }}" href="{{ url_for('index') }}">Home</a>
       <a class="{{ 'on' if request.endpoint == 'settings' }}" href="{{ url_for('settings') }}">Settings</a></nav>
</div></header>
<div class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ cat }}"><span>{{ msg }}</span><b onclick="this.parentElement.remove()">✕</b></div>
  {% endfor %}
  {% block content %}{% endblock %}
  <div class="foot">{{ name }} v{{ version }}</div>
</div>
<script>
// Two-tap delete (browser pop-ups like confirm() do not work inside the Android app): tap once -> "Sure?", tap again -> delete.
document.addEventListener("click", e => {
  const b = e.target.closest(".js-del"); if (!b || b.dataset.armed) return;
  e.preventDefault(); b.dataset.armed = "1"; const t = b.textContent;
  b.textContent = "Sure?"; b.classList.add("armed");
  setTimeout(() => { delete b.dataset.armed; b.textContent = t; b.classList.remove("armed"); }, 3000);
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
